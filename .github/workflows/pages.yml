name: Deploy Live Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact audited package into clean site/
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q -o omsp-complete.zip -d /tmp/omsp-extract
          # ZIP has top-level omsp-complete/
          SRC=/tmp/omsp-extract/omsp-complete
          if [ ! -f "$SRC/omsp.html" ]; then
            # fallback if structure differs
            SRC=/tmp/omsp-extract
          fi
          cp "$SRC/omsp.html" site/
          touch site/.nojekyll
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=omsp.html">
            <title>OMSP — OpenMesha Social Protocol</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #070a12; color: #e8eef5;
                     display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
              a { color: #34E0D8; }
            </style>
          </head>
          <body>
            <p>Redirecting to <a href="omsp.html">OMSP live app</a>…</p>
          </body>
          </html>
          EOF
          # Integrity check against the audited hash
          EXPECTED=1e9abd2b98deb6bc8789648195a04aad1ec871ecc9b568236de35a15924caa01
          ACTUAL=$(sha256sum site/omsp.html | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FATAL: omsp.html sha256 mismatch (got $ACTUAL)"
            exit 1
          fi
          echo "omsp.html integrity OK ($ACTUAL)"
          ls -la site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
